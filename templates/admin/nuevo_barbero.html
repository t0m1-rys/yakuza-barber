<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nuevo Barbero | Yakuza Barber</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .contenedor {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* =========================
           VOLVER
        ========================= */

        .volver {
            color: #aaa;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
            transition: 0.2s;
        }

        .volver:hover {
            color: white;
        }

        /* =========================
           ENCABEZADO
        ========================= */

        h1 {
            margin-bottom: 8px;
            font-size: 30px;
        }

        .subtitulo {
            color: #888;
            margin-bottom: 30px;
        }

        /* =========================
           FORMULARIO
        ========================= */

        .formulario {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 30px;
        }

        .campo {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            background: #292929;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: white;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* =========================
           INPUT FOTO
        ========================= */

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        .ayuda {
            display: block;
            margin-top: 7px;
            color: #777;
            font-size: 12px;
        }

        /* =========================
           BOTONES
        ========================= */

        .acciones {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 15px;
        }

        .guardar {
            background: white;
            color: #111;
        }

        .guardar:hover {
            background: #ddd;
        }

        .cancelar {
            background: #292929;
            color: white;
        }

        .cancelar:hover {
            background: #3a3a3a;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .contenedor {
                padding: 25px 15px;
            }

            .formulario {
                padding: 20px;
            }

            .acciones {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <!-- =========================
         VOLVER
    ========================= -->

    <a
        href="/admin/barberos"
        class="volver"
    >
        ← Volver a barberos
    </a>


    <!-- =========================
         ENCABEZADO
    ========================= -->

    <h1>
        Agregar barbero
    </h1>

    <p class="subtitulo">
        Registra un nuevo barbero en Yakuza Barber.
    </p>


    <!-- =========================
         FORMULARIO
    ========================= -->

    <form
        action="/admin/barbero/nuevo"
        method="POST"
        enctype="multipart/form-data"
        class="formulario"
    >


        <!-- =========================
             NOMBRE
        ========================= -->

        <div class="campo">

            <label for="nombre">
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej: Bruno"
                required
            >

        </div>


        <!-- =========================
             ESPECIALIDAD
        ========================= -->

        <div class="campo">

            <label for="especialidad">
                Especialidad
            </label>

            <input
                type="text"
                id="especialidad"
                name="especialidad"
                placeholder="Ej: Degradados y perfilados"
            >

        </div>


        <!-- =========================
             DESCRIPCIÓN
        ========================= -->

        <div class="campo">

            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                name="descripcion"
                placeholder="Describe al barbero..."
            ></textarea>

        </div>


        <!-- =========================
             FOTOGRAFÍA
        ========================= -->

        <div class="campo">

            <label for="foto">
                Fotografía
            </label>

            <input
                type="file"
                id="foto"
                name="foto"
                accept="image/png, image/jpeg, image/webp"
            >

            <span class="ayuda">
                Formatos permitidos: JPG, PNG o WEBP.
            </span>

        </div>


        <!-- =========================
             BOTONES
        ========================= -->

        <div class="acciones">


            <a
                href="/admin/barberos"
                class="btn cancelar"
            >
                Cancelar
            </a>


            <button
                type="submit"
                class="btn guardar"
            >
                Guardar barbero
            </button>


        </div>


    </form>


</div>


</body>

</html>
