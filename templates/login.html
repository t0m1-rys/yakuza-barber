<!DOCTYPE html>

<html lang="es">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Yakuza Barber</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
```

</head>

<body class="bg-dark">

<div class="container">

```
<div class="row justify-content-center align-items-center vh-100">

    <div class="col-12 col-md-6 col-lg-4">


        <div class="card shadow">

            <div class="card-body p-4">


                <div class="text-center mb-4">

                    <h2>

                        YAKUZA BARBER

                    </h2>

                    <p class="text-muted">

                        Panel de administración

                    </p>

                </div>


                {% with mensajes = get_flashed_messages(
                    with_categories=true
                ) %}

                    {% if mensajes %}

                        {% for categoria, mensaje in mensajes %}

                            <div class="alert alert-{{ categoria }}">

                                {{ mensaje }}

                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}


                <form
                    method="POST"
                    action="/login"
                >


                    <div class="mb-3">

                        <label
                            for="usuario"
                            class="form-label"
                        >

                            Usuario

                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            class="form-control"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="contrasena"
                            class="form-label"
                        >

                            Contraseña

                        </label>

                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            class="form-control"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark w-100"
                    >

                        Iniciar sesión

                    </button>


                </form>


                <div class="text-center mt-3">

                    <a href="/">

                        Volver al sitio

                    </a>

                </div>


            </div>

        </div>


    </div>

</div>
```

</div>

</body>

</html>
